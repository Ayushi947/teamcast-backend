<!doctype html>

    <script>
      // Utility function to convert file to base64
      async function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => {
            const base64 = reader.result.split(',')[1];
            resolve(base64);
          };
          reader.onerror = (error) => reject(error);
        });
      }

      // Get base URL with trailing slash removed
      function getBaseUrl() {
        const baseUrl = document.getElementById('baseUrlInput').value.trim();
        return baseUrl.endsWith('/') ? baseUrl.slice(0, -1) : baseUrl;
      }

      // Test connection to API
      document
        .getElementById('testConnectionBtn')
        .addEventListener('click', async () => {
          const connectionStatus = document.getElementById('connectionStatus');
          const baseUrl = getBaseUrl();

          try {
            connectionStatus.innerHTML =
              '<div class="text-info">Testing connection...</div>';
            const response = await fetch(`${baseUrl}/voice/synthesize`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                text: 'Test connection',
                voice: 'en-US-Chirp3-HD-Leda',
                languageCode: 'en-US',
              }),
            });

            if (response.ok) {
              connectionStatus.innerHTML =
                '<div class="text-success">✓ Connection successful</div>';
            } else {
              const error = await response.json();
              throw new Error(error.error?.message || 'Connection failed');
            }
          } catch (error) {
            connectionStatus.innerHTML = `<div class="text-danger">✗ ${error.message}</div>`;
          }
        });

      // Text to Speech functionality
      document
        .getElementById('synthesizeBtn')
        .addEventListener('click', async () => {
          const textInput = document.getElementById('textInput');
          const voiceSelect = document.getElementById('voiceSelect');
          const ttsError = document.getElementById('ttsError');
          const ttsAudio = document.getElementById('ttsAudio');
          const baseUrl = getBaseUrl();

          try {
            ttsError.textContent = '';
            // Extract language code from voice name (e.g., "en-US-Chirp3-HD-Leda" -> "en-US")
            const voiceName = voiceSelect.value;
            const languageCode = voiceName.split('-').slice(0, 2).join('-');

            const response = await fetch(`${baseUrl}/voice/synthesize`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                text: textInput.value,
                voice: voiceSelect.value,
                languageCode: languageCode,
              }),
            });

            if (!response.ok) {
              const error = await response.json();
              throw new Error(
                error.error?.message || 'Failed to synthesize speech'
              );
            }

            // Get the response content type
            const contentType = response.headers.get('content-type');
            console.log('Response content type:', contentType);

            if (contentType && contentType.includes('audio/')) {
              // If it's a direct audio response, use it as is
              const audioBlob = await response.blob();
              ttsAudio.src = URL.createObjectURL(audioBlob);
            } else {
              // If it's JSON with base64 audio
              const data = await response.json();
              console.log('Response data:', data);

              if (!data.data.audioContent) {
                throw new Error('No audio content in response');
              }

              ttsAudio.src = `data:audio/mp3;base64,${data.data.audioContent}`;
            }

            ttsAudio.style.display = 'block';

            // Add error handling for audio playback
            ttsAudio.onerror = (e) => {
              ttsError.textContent =
                'Error playing audio: ' + e.target.error.message;
              ttsAudio.style.display = 'none';
            };

            // Ensure audio is loaded before playing
            ttsAudio.onloadeddata = () => {
              ttsAudio.play().catch((error) => {
                ttsError.textContent = 'Error playing audio: ' + error.message;
                ttsAudio.style.display = 'none';
              });
            };
          } catch (error) {
            ttsError.textContent = error.message;
            ttsAudio.style.display = 'none';
          }
        });

      // Speech to Text functionality
      document
        .getElementById('transcribeBtn')
        .addEventListener('click', async () => {
          const audioInput = document.getElementById('audioInput');
          const languageSelect = document.getElementById('sttLanguageSelect');
          const sttError = document.getElementById('sttError');
          const transcriptionResult = document.getElementById(
            'transcriptionResult'
          );
          const transcribedText = document.getElementById('transcribedText');
          const confidenceFill = document.getElementById('confidenceFill');
          const confidenceText = document.getElementById('confidenceText');
          const baseUrl = getBaseUrl();

          try {
            sttError.textContent = '';
            if (!audioInput.files.length) {
              throw new Error('Please select an audio file');
            }

            const audioFile = await fileToBase64(audioInput.files[0]);
            const response = await fetch(`${baseUrl}/voice/transcribe`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                audioContent: audioFile,
                languageCode: languageSelect.value,
                audioEncoding: 'MP3',
              }),
            });

            if (!response.ok) {
              const error = await response.json();
              throw new Error(
                error.error?.message || 'Failed to transcribe audio'
              );
            }

            const { text, confidence } = await response.json();
            transcribedText.textContent = text;
            confidenceFill.style.width = `${confidence * 100}%`;
            confidenceText.textContent = `Confidence: ${(confidence * 100).toFixed(1)}%`;
            transcriptionResult.style.display = 'block';
          } catch (error) {
            sttError.textContent = error.message;
            transcriptionResult.style.display = 'none';
          }
        });
    </script>

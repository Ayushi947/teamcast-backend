apiVersion: v1
kind: ServiceAccount
metadata:
  name: teamcast-backend
  namespace: teamcast
  annotations:
    # Workload Identity annotation - replace with your actual GSA email
    iam.gke.io/gcp-service-account: teamcast-backend@teamcastai.iam.gserviceaccount.com
  labels:
    app: teamcast-backend
---
# Optional: Create a cluster role for additional permissions if needed
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teamcast-backend-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teamcast-backend-binding
subjects:
  - kind: ServiceAccount
    name: teamcast-backend
    namespace: teamcast
roleRef:
  kind: ClusterRole
  name: teamcast-backend-role
  apiGroup: rbac.authorization.k8s.io

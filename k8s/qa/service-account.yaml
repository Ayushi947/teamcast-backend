apiVersion: v1
kind: ServiceAccount
metadata:
  name: teamcast-backend-qa
  namespace: teamcast-qa
  annotations:
    # Workload Identity annotation - replace with your actual GSA email for QA
    iam.gke.io/gcp-service-account: teamcast-backend-qa@teamcastai.iam.gserviceaccount.com
  labels:
    app: teamcast-backend
    environment: qa
---
# Optional: Create a cluster role for additional permissions if needed
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teamcast-backend-qa-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teamcast-backend-qa-binding
subjects:
  - kind: ServiceAccount
    name: teamcast-backend-qa
    namespace: teamcast-qa
roleRef:
  kind: ClusterRole
  name: teamcast-backend-qa-role
  apiGroup: rbac.authorization.k8s.io

# Secret template - replace values before applying
apiVersion: v1
kind: Secret
metadata:
  name: teamcast-secrets
  namespace: teamcast
  labels:
    app: teamcast-backend
type: Opaque
stringData:
  # Database
  database-url: 'postgresql://username:password@host:port/database'

  # JWT
  jwt-secret: 'your-jwt-secret-here-min-32-chars'
  refresh-token-secret: 'your-refresh-token-secret-here-min-32-chars'

  # Redis (if password required)
  redis-password: 'your-redis-password'

  # Brevo
  brevo-api-key: 'your-brevo-api-key'

  # OAuth
  google-oauth-client-id: 'your-google-oauth-client-id'
  google-oauth-client-secret: 'your-google-oauth-client-secret'
  github-oauth-client-id: 'your-github-oauth-client-id'
  github-oauth-client-secret: 'your-github-oauth-client-secret'
  oauth-state-secret: 'your-oauth-state-secret-min-32-chars'

  # Stream Chat
  stream-api-key: 'your-stream-api-key'
  stream-api-secret: 'your-stream-api-secret'

  # Cron
  cron-api-key: 'your-cron-api-key'

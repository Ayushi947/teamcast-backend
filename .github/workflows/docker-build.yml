name: Build and Push Docker Image

on:
   workflow_dispatch:
  # push:
  #   branches:
  #     - main

env:
  PROJECT_ID: teamcastai
  REGISTRY: us-central1-docker.pkg.dev/teamcastai/teamcast
  REPOSITORY: teamcast
  IMAGE_NAME: backend
  IMAGE_TAG: v1.${{ github.run_number }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Docker Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: us-central1-docker.pkg.dev/teamcastai/teamcast/backend:v1.${{ github.run_number }}
